[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "discourse-act-aware-persuasion-modeling"
version = "0.1.0"
description = "Research starter repo for CMV persuasion and discourse act modeling"
requires-python = ">=3.10"
dependencies = [
  "convokit>=4.0.0",
  "torch>=2.0.0",
  "transformers>=4.0.0",
  "datasets>=2.19.0",
  "huggingface_hub>=0.23.0",
  "scikit-learn>=1.3.0",
  "pandas>=2.0.0",
  "pyarrow>=15.0.0",
  "matplotlib>=3.7.0",
  "tqdm>=4.66.0",
  "numpy>=1.24.0",
  "joblib>=1.3.0",
  "nltk>=3.8.0",
  "spacy>=3.7.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
