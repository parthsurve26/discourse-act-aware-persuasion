[project]
name = "discourse-act-aware-persuasion"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
"convokit>=4.0.0",
"torch>=2.0.0",
"transformers>=4.0.0",
"scikit-learn>=1.3.0",
"pandas>=2.0.0",
"pyarrow>=15.0.0",
"matplotlib>=3.7.0",
"tqdm>=4.66.0",
"numpy>=1.24.0",
"joblib>=1.3.0",
"nltk>=3.8.0",
"spacy>=3.7.0"
]

[tool.uv.sources]
torch = [
  { index = "pytorch-cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchvision = [
  { index = "pytorch-cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true